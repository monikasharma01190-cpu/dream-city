name: Build My Dream City APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi
          echo "Found ZIP: $ZIP"
          mkdir -p game
          unzip -o "$ZIP" -d game
          find game -name project.godot -print

      - name: Verify Godot project
        run: |
          PROJECT=$(find game -name project.godot | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: project.godot not found"
            exit 1
          fi
          echo "Project found: $PROJECT"
          ls -la "$(dirname "$PROJECT")"
